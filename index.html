<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>蔵書スキャナ</title>
<style>
  /* ===== 基本 ===== */
  :root{
    --bg:#0f1115; --panel:#1a1e26; --line:#2c3340;
    --fg:#e8ecf2; --sub:#97a1b0;
    --ok:#3ddc84; --ng:#ff6b6b; --warn:#ffc042; --accent:#4c8dff;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ===== ヘッダ ===== */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:calc(var(--safe-t) + 8px) 12px 8px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  header h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.02em}
  header .phase{font-size:11px; color:var(--sub)}
  header .count{margin-left:auto; font-size:13px; color:var(--sub); text-align:right}
  header .count b{color:var(--fg); font-size:17px}

  /* ===== カメラ表示エリア ===== */
  #stage{flex:1 1 auto; position:relative; background:#000; overflow:hidden}
  #video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000}

  /* 読取枠。この枠の中だけをデコードに掛ける（見たままが読取対象） */
  #reticle{
    position:absolute; border:2px solid rgba(255,255,255,.85); border-radius:10px;
    box-shadow:0 0 0 4000px rgba(0,0,0,.38); pointer-events:none;
    transition:border-color .15s;
  }
  #reticle.hit{border-color:var(--ok)}
  #reticle.dup{border-color:var(--warn)}

  #hint{
    position:absolute; left:0; right:0; bottom:10px; text-align:center;
    font-size:12px; color:#cfd6e0; text-shadow:0 1px 3px #000; pointer-events:none;
  }

  /* トースト（読取結果を画面上部に出す） */
  #toast{
    position:absolute; top:10px; left:10px; right:10px;
    padding:10px 12px; border-radius:10px; background:rgba(20,24,32,.94);
    border:1px solid var(--line); font-size:14px; line-height:1.4;
    opacity:0; transform:translateY(-8px); transition:opacity .18s, transform .18s;
    pointer-events:none;
  }
  #toast.show{opacity:1; transform:none}
  #toast.ok{border-color:var(--ok)}
  #toast.dup{border-color:var(--warn)}
  #toast.ng{border-color:var(--ng)}
  #toast .main{font-size:17px; font-weight:600; overflow-wrap:anywhere}
  #toast .main.isbn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.04em}
  #toast .tag{font-size:11px; color:var(--sub); margin-top:2px}

  /* 起動前オーバーレイ */
  #startPanel{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:24px;
    background:#0f1115; text-align:center;
  }
  #startPanel p{margin:0; color:var(--sub); font-size:13px; max-width:22em}
  #startBtn{
    width:180px; height:180px; border-radius:50%; border:none;
    background:var(--accent); color:#fff; font-size:19px; font-weight:700;
    box-shadow:0 8px 30px rgba(76,141,255,.35);
  }
  #startBtn:active{transform:scale(.97)}
  #startBtn[disabled]{background:#39414f; box-shadow:none}

  /* ===== エラー表示（握り潰さず必ず出す） ===== */
  #errorBox{
    flex:0 0 auto; display:none; padding:10px 12px; background:#3a1c1c;
    border-top:1px solid #6b2b2b; color:#ffd9d9; font-size:13px; white-space:pre-wrap;
    position:relative;
  }
  #errorBox.show{display:block}
  #errorBox b{color:#ff9a9a}
  #errorBox .close{
    position:absolute; top:4px; right:6px; background:none; border:none;
    color:#ffd9d9; font-size:18px; padding:4px 8px;
  }

  /* ===== 下部コントロール（親指で届く位置） ===== */
  footer{
    flex:0 0 auto; display:flex; gap:8px; padding:10px 12px calc(10px + var(--safe-b));
    background:var(--panel); border-top:1px solid var(--line);
  }
  button.ctl{
    flex:1; min-height:52px; border-radius:12px; border:1px solid var(--line);
    background:#232a35; color:var(--fg); font-size:15px; font-weight:600;
  }
  button.ctl:active{background:#2d3542}
  button.ctl.primary{background:var(--accent); border-color:var(--accent); color:#fff}

  /* ===== 全画面ビュー（蔵書・編集） ===== */
  .view{
    position:fixed; inset:0; background:var(--bg); z-index:30;
    transform:translateY(100%); transition:transform .22s ease;
    display:flex; flex-direction:column;
  }
  .view.open{transform:none}
  .view > .vhead{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:calc(var(--safe-t) + 10px) 12px 10px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .view .vhead .who{flex:1 1 auto; min-width:0}
  .view .vhead b{font-size:15px}
  .view .vhead .stat{font-size:11px; color:var(--sub)}
  .view .vhead button{
    flex:0 0 auto; background:none; border:1px solid var(--line); border-radius:8px;
    color:var(--accent); font-size:14px; padding:10px 12px; font-weight:600;
  }
  .view .vhead button.go{background:var(--accent); border-color:var(--accent); color:#fff}
  .view .scroll{flex:1 1 auto; overflow:auto; -webkit-overflow-scrolling:touch}

  /* ---- 蔵書ビューのツールバー ---- */
  #tools{
    flex:0 0 auto; display:flex; gap:8px; padding:10px 12px;
    border-bottom:1px solid var(--line); background:var(--panel);
  }
  #q{
    flex:1 1 auto; min-width:0; font-size:16px; padding:10px 12px; border-radius:10px;
    border:1px solid var(--line); background:#232a35; color:var(--fg);
  }
  #sortSel{
    flex:0 0 auto; font-size:15px; padding:10px 6px; border-radius:10px;
    border:1px solid var(--line); background:#232a35; color:var(--fg);
  }
  #backupBar{
    flex:0 0 auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:8px 12px; border-bottom:1px solid var(--line); font-size:11px; color:var(--sub);
  }
  #backupBar .msg{flex:1 1 100%; min-width:0}
  #backupBar .msg.warn{color:var(--warn)}
  #backupBar button{
    background:#232a35; border:1px solid var(--line); border-radius:8px;
    color:var(--fg); font-size:12px; padding:8px 10px;
  }

  /* ---- 蔵書リスト ---- */
  #libList{margin:0; padding:0 0 calc(24px + var(--safe-b))}
  #libList li{
    list-style:none; display:flex; gap:10px; padding:10px 12px;
    border-bottom:1px solid #222833; min-width:0; align-items:flex-start;
  }
  #libList li:active{background:#161b23}
  #libList .cov{
    flex:0 0 auto; width:40px; height:56px; border-radius:3px; object-fit:cover;
    background:#2a313d; border:1px solid var(--line);
  }
  #libList .body{flex:1 1 auto; min-width:0; overflow-wrap:anywhere}
  #libList .ttl{font-size:14px; font-weight:600; line-height:1.35}
  #libList .ttl.wait{color:var(--sub); font-weight:400}
  #libList .ttl.bad{color:var(--warn); font-weight:400}
  #libList .meta{font-size:12px; color:var(--sub); line-height:1.4}
  #libList .code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px;
    color:var(--sub); letter-spacing:.03em;
  }
  #libList .chip{
    display:inline-block; font-size:10px; padding:0 5px; border-radius:4px;
    border:1px solid var(--line); color:var(--sub); margin-left:6px; vertical-align:1px;
    font-family:-apple-system,sans-serif; letter-spacing:0;
  }
  #libList .chip.openbd{color:#8fd4a8; border-color:#2f5a41}
  #libList .chip.googlebooks{color:#9cc2ff; border-color:#2f4468}
  #libList .chip.manual{color:#d7b3ff; border-color:#4b3a66}
  #libList .chip.loc{color:#ffd79a; border-color:#5c4527}
  #libList .empty{color:var(--sub); padding:40px 14px; text-align:center; display:block}
  #libList .retry{
    align-self:center; flex:0 0 auto; background:#2b323e; border:1px solid var(--line);
    color:var(--fg); border-radius:8px; font-size:12px; padding:8px 10px;
  }

  /* ---- 編集フォーム ---- */
  #form{padding:12px 12px calc(28px + var(--safe-b))}
  #form label{display:block; margin:0 0 12px}
  #form .lab{font-size:12px; color:var(--sub); margin-bottom:4px}
  #form input, #form textarea{
    width:100%; font-size:16px; font-family:inherit; padding:10px 12px; border-radius:10px;
    border:1px solid var(--line); background:#232a35; color:var(--fg);
  }
  #form textarea{min-height:80px; resize:vertical}
  #form input[readonly]{color:var(--sub); background:#1d232c}
  #form .row{display:flex; gap:8px}
  #form .row > *{flex:1 1 0; min-width:0}
  #form .note{font-size:11px; color:var(--sub); margin:-8px 0 12px}
  #form .danger{
    width:100%; margin-top:8px; padding:14px; border-radius:10px;
    background:#3a1c1c; border:1px solid #6b2b2b; color:#ffb3b3; font-size:15px; font-weight:600;
  }
  #isbnRow{display:flex; gap:8px}
  #isbnRow input{flex:1 1 auto; min-width:0}
  #isbnRow button{
    flex:0 0 auto; padding:0 14px; border-radius:10px; border:1px solid var(--accent);
    background:none; color:var(--accent); font-size:14px; font-weight:600;
  }

  /* ---- 汎用ダイアログ ---- */
  #modal{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(0,0,0,.6);
  }
  #modal.open{display:flex}
  #modal .box{
    width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:18px; max-height:80%; overflow:auto;
  }
  #modal h2{margin:0 0 8px; font-size:16px}
  #modal p{margin:0 0 14px; font-size:13px; color:var(--sub); white-space:pre-wrap}
  #modal .acts{display:flex; flex-direction:column; gap:8px}
  #modal .acts button{
    padding:13px; border-radius:10px; border:1px solid var(--line);
    background:#232a35; color:var(--fg); font-size:15px; font-weight:600;
  }
  #modal .acts button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  #modal .acts button.ghost{background:none; color:var(--sub); font-weight:400}

  /* デバッグ行（実機での切り分け用） */
  #debug{
    position:absolute; top:0; left:0; right:0; padding:2px 6px;
    font:10px/1.4 ui-monospace,Menlo,monospace; color:#8ea0b8; white-space:pre-wrap;
    background:rgba(0,0,0,.45); pointer-events:none; display:none;
  }
  #debug.show{display:block}
</style>
</head>
<body>

<header>
  <div>
    <h1>蔵書スキャナ</h1>
    <div class="phase">フェーズ4 — Word 出力</div>
  </div>
  <div class="count">蔵書 <b id="cnt">0</b> 冊<br><span id="statLine" class="phase"></span></div>
</header>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div id="reticle"></div>
  <div id="debug"></div>
  <div id="toast"></div>
  <div id="hint">枠の中に <b>978 / 979</b> で始まる上段のバーコードを入れてください</div>

  <div id="startPanel">
    <button id="startBtn">カメラを<br>起動</button>
    <p>iOS ではボタンを押した直後でないとカメラを起動できません。起動後は枠に近づけるだけで連続して読み取ります。</p>
  </div>
</div>

<div id="errorBox"></div>

<footer>
  <button class="ctl" id="toggleBtn" disabled>停止</button>
  <button class="ctl" id="libBtn">蔵書 (0)</button>
  <button class="ctl" id="manualBtn">手入力</button>
</footer>

<!-- ===== 蔵書ビュー ===== -->
<section class="view" id="library">
  <div class="vhead">
    <div class="who">
      <b>蔵書</b>
      <div class="stat" id="libStat"></div>
    </div>
    <button id="dbgBtn">情報</button>
    <button id="libCloseBtn">閉じる</button>
  </div>
  <div id="tools">
    <input id="q" type="search" placeholder="書名・著者・出版社・ISBN で絞り込み" autocomplete="off">
    <select id="sortSel">
      <option value="scannedAt">登録日</option>
      <option value="title">書名</option>
      <option value="authors">著者</option>
      <option value="publisher">出版社</option>
    </select>
  </div>
  <div id="backupBar">
    <div class="msg" id="backupMsg"></div>
    <button id="docxBtn">Word 目録を出力</button>
    <button id="exportBtn">バックアップ (JSON)</button>
    <button id="importBtn">読み込み</button>
    <button id="retryAllBtn">未取得を再取得</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
  <div class="scroll"><ul id="libList"></ul></div>
</section>

<!-- ===== 編集ビュー ===== -->
<section class="view" id="editor">
  <div class="vhead">
    <div class="who"><b id="edTitle">編集</b><div class="stat" id="edStat"></div></div>
    <button id="edCancel">やめる</button>
    <button id="edSave" class="go">保存</button>
  </div>
  <div class="scroll">
    <div id="form">
      <label>
        <div class="lab">ISBN</div>
        <div id="isbnRow">
          <input id="fIsbn" type="text" inputmode="numeric" autocomplete="off" placeholder="9784… (無い本は空のままで可)">
          <button type="button" id="fLookup">照会</button>
        </div>
      </label>
      <div class="note" id="isbnNote">バーコードが無い本は空のままで登録できます（内部キーが自動で振られます）。</div>

      <label><div class="lab">書名</div><input id="fTitle" type="text" autocomplete="off"></label>
      <label><div class="lab">サブタイトル</div><input id="fSubtitle" type="text" autocomplete="off"></label>
      <label><div class="lab">並列書名（欧文タイトルなど・Word 目録には出しません）</div><input id="fAltTitle" type="text" autocomplete="off"></label>
      <label><div class="lab">著者（複数は ／ 区切り）</div><input id="fAuthors" type="text" autocomplete="off"></label>
      <div class="row">
        <label><div class="lab">出版社</div><input id="fPublisher" type="text" autocomplete="off"></label>
        <label><div class="lab">出版年</div><input id="fPubdate" type="text" autocomplete="off" placeholder="2024-03"></label>
      </div>
      <label><div class="lab">配置場所</div><input id="fLocation" type="text" autocomplete="off" placeholder="本棚A 3段目"></label>
      <label><div class="lab">タグ（読点・カンマ・空白区切り）</div><input id="fTags" type="text" autocomplete="off"></label>
      <label><div class="lab">メモ</div><textarea id="fNote"></textarea></label>
      <label><div class="lab">書影 URL</div><input id="fCover" type="url" autocomplete="off"></label>
      <div class="note" id="srcNote"></div>
      <button type="button" class="danger" id="edDelete">この本を削除</button>
    </div>
  </div>
</section>

<!-- ===== 汎用ダイアログ ===== -->
<div id="modal"><div class="box">
  <h2 id="mTitle"></h2>
  <p id="mBody"></p>
  <div class="acts" id="mActs"></div>
</div></div>

<script type="module">
// =============================================================
// 蔵書スキャナ フェーズ3
//   フェーズ2 までの「読取 + 書誌取得」に、IndexedDB への保存と
//   蔵書一覧（検索・並べ替え・編集・削除）、手入力、JSON 入出力を足したもの。
// =============================================================

import {
  readBarcodes,
  prepareZXingModule,
} from "https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/es/reader/index.js";

// wasm 本体の配置先（バージョン固定）
const WASM_BASE = "https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/reader/";

// ---- DOM ----
const $ = (id) => document.getElementById(id);
const video     = $("video");
const stage     = $("stage");
const reticle   = $("reticle");
const toastEl   = $("toast");
const errorBox  = $("errorBox");
const startPanel= $("startPanel");
const startBtn  = $("startBtn");
const toggleBtn = $("toggleBtn");
const libBtn    = $("libBtn");
const manualBtn = $("manualBtn");
const libraryEl = $("library");
const editorEl  = $("editor");
const libList   = $("libList");
const cntEl     = $("cnt");
const statLine  = $("statLine");
const libStat   = $("libStat");
const debugEl   = $("debug");
const qEl       = $("q");
const sortSel   = $("sortSel");

// ---- 状態 ----
let stream = null;          // MediaStream
let running = false;        // デコードループ稼働中か
let viewOpen = false;       // 全画面ビューを開いている間はデコードを止める
let wakeLock = null;
let audioCtx = null;
const books = [];           // 全レコード（メモリ上のミラー）
const byIsbn = new Map();   // isbn13 -> レコード
const cooldown = new Map(); // isbn -> 最後に反応した時刻(ms)
const COOLDOWN_MS = 2500;   // 同じコードへの再反応を抑える時間

// 読取枠の大きさ（表示エリアに対する比率）
const BOX = { w: 0.90, h: 0.42 };

// デコード用の裏キャンバス
const canvas = document.createElement("canvas");
const ctx2d = canvas.getContext("2d", { willReadFrequently: true });

// zxing-wasm の読取オプション
//  formats は EAN13 のみ。ただし日本の書籍は2段バーコードで下段(192...)も EAN-13 なので
//  maxNumberOfSymbols を増やして両方拾い、後段の isIsbn13() で上段だけ採用する。
const READER_OPTIONS = {
  formats: ["EAN13"],
  tryHarder: true,
  tryRotate: true,
  tryInvert: false,
  tryDownscale: true,
  maxNumberOfSymbols: 4,
  binarizer: "LocalAverage",
  eanAddOnSymbol: "Ignore",
  returnErrors: false,
};

// -------------------------------------------------------------
// エラー表示（握り潰さない）
// -------------------------------------------------------------
function showError(title, detail) {
  errorBox.innerHTML = "";
  const b = document.createElement("b");
  b.textContent = title;
  const close = document.createElement("button");
  close.className = "close";
  close.textContent = "×";
  close.addEventListener("click", clearError);
  errorBox.append(b, document.createTextNode(detail ? "\n" + detail : ""), close);
  errorBox.classList.add("show");
  console.error(title, detail);
}
function clearError() {
  errorBox.classList.remove("show");
  errorBox.textContent = "";
}

// -------------------------------------------------------------
// 汎用ダイアログ（confirm より選択肢を出したい場面用）
// -------------------------------------------------------------
function dialog(title, body, actions) {
  return new Promise((resolve) => {
    $("mTitle").textContent = title;
    $("mBody").textContent = body || "";
    const acts = $("mActs");
    acts.innerHTML = "";
    actions.forEach((a) => {
      const btn = document.createElement("button");
      btn.textContent = a.label;
      if (a.kind) btn.className = a.kind;
      btn.addEventListener("click", () => {
        $("modal").classList.remove("open");
        resolve(a.value);
      });
      acts.append(btn);
    });
    $("modal").classList.add("open");
  });
}

// =============================================================
// IndexedDB
//   DB名 bookshelf / store books / keyPath isbn13
// =============================================================
const DB_NAME = "bookshelf", DB_VER = 1, STORE = "books";
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: "isbn13" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function store(mode) {
  return db.transaction(STORE, mode).objectStore(STORE);
}
function reqToPromise(req) {
  return new Promise((res, rej) => {
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

/** 保存される形だけを取り出す（_ 始まりの実行時フィールドは保存しない） */
function toPlain(rec) {
  return {
    isbn13:    rec.isbn13,
    title:     rec.title || "",
    altTitle:  rec.altTitle || "",   // "= " の後ろに付いてくる並列書名（欧文タイトルなど）
    subtitle:  rec.subtitle || "",
    authors:   rec.authors || "",
    publisher: rec.publisher || "",
    pubdate:   rec.pubdate || "",
    coverUrl:  rec.coverUrl || "",
    location:  rec.location || "",
    tags:      Array.isArray(rec.tags) ? rec.tags : [],
    note:      rec.note || "",
    source:    rec.source || "",
    scannedAt: rec.scannedAt || new Date().toISOString(),
  };
}

async function dbPut(rec) {
  try {
    await reqToPromise(store("readwrite").put(toPlain(rec)));
  } catch (e) {
    showError("保存できませんでした（" + rec.isbn13 + "）",
      (e && e.message) || String(e) +
      "\nプライベートブラウズ中だと IndexedDB が使えないことがあります。");
    throw e;
  }
}
async function dbDelete(key) {
  await reqToPromise(store("readwrite").delete(key));
}
async function dbGetAll() {
  return await reqToPromise(store("readonly").getAll());
}

// -------------------------------------------------------------
// EAN-13 / ISBN 判定
// -------------------------------------------------------------
/** EAN-13 のチェックディジット検証 */
function isValidEan13(code) {
  if (!/^\d{13}$/.test(code)) return false;
  let sum = 0;
  for (let i = 0; i < 12; i++) {
    sum += Number(code[i]) * (i % 2 === 0 ? 1 : 3);
  }
  const check = (10 - (sum % 10)) % 10;
  return check === Number(code[12]);
}

/** 書籍の ISBN-13 か（978/979 始まり ＋ チェックディジット） */
function isIsbn13(code) {
  return /^97[89]\d{10}$/.test(code) && isValidEan13(code);
}

/** ISBN を持たない本のための内部キー */
function makeNoIsbnKey() {
  const d = new Date();
  const p = (n, w) => String(n).padStart(w || 2, "0");
  return "NOISBN-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
         p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) +
         "-" + Math.random().toString(36).slice(2, 6);
}
const isNoIsbn = (key) => String(key || "").startsWith("NOISBN-");

/** タイムアウト付き JSON 取得。失敗理由が分かるメッセージで throw する */
async function fetchJson(url, label, timeoutMs = 9000) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ac.signal });
    if (res.status === 429) {
      const err = new Error(label + ": 利用上限に達しました (HTTP 429)");
      err.quota = true;
      throw err;
    }
    if (!res.ok) throw new Error(label + ": HTTP " + res.status);
    return await res.json();
  } catch (e) {
    if (e.name === "AbortError") throw new Error(label + ": タイムアウト (" + (timeoutMs / 1000) + "秒)");
    if (e instanceof TypeError) throw new Error(label + ": 通信できません（オフラインの可能性）");
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

/** "200306" / "20030601" / "2020.3" などを "2003-06" 形式へ寄せる */
function normPubdate(v) {
  if (!v) return "";
  const s = String(v).trim();
  let m;
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return m[1] + "-" + m[2] + "-" + m[3];
  if ((m = s.match(/^(\d{4})(\d{2})$/)))         return m[1] + "-" + m[2];
  if ((m = s.match(/^(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})$/)))
    return m[1] + "-" + String(m[2]).padStart(2, "0") + "-" + String(m[3]).padStart(2, "0");
  if ((m = s.match(/^(\d{4})[.\/-](\d{1,2})$/)))
    return m[1] + "-" + String(m[2]).padStart(2, "0");
  if ((m = s.match(/^(\d{4})$/))) return m[1];
  return s;
}

/**
 * openBD / NDL 系の人名表記を読める形に寄せる。
 *   "夏目, 漱石, 1867-1916" -> "夏目漱石"
 *   "Cherny, Boris"         -> "Cherny, Boris"（欧文は並べ替えると誤るのでそのまま）
 */
function normPersonName(raw) {
  if (!raw) return "";
  let s = String(raw).trim();
  s = s.replace(/,\s*\d{3,4}\s*-\s*\d{0,4}\s*$/, "").trim();  // 生没年を落とす
  const parts = s.split(/\s*,\s*/).filter(Boolean);
  if (parts.length === 2 && !/[A-Za-z]/.test(s)) return parts.join("");  // 和名は姓名を繋ぐ
  return s;
}

/**
 * "本題 = Parallel title : サブタイトル" を 本題 / 並列書名 / サブタイトル に割る。
 *
 * 並列書名（= の後ろ）は蔵書目録では邪魔になるので本題から外すが、
 * "ぎゃるアシ = Gal Assistant. 3" のように巻数が並列書名の末尾に付く本があるため、
 * 末尾の数字だけは本題側に移しておく（そうしないと巻数が目録から消える）。
 */
function splitTitle(raw) {
  let s = (raw || "").trim();

  let subtitle = "";
  const ci = s.indexOf(" : ");
  if (ci >= 0) { subtitle = s.slice(ci + 3).trim(); s = s.slice(0, ci).trim(); }

  let altTitle = "";
  const ei = s.indexOf(" = ");
  if (ei >= 0) { altTitle = s.slice(ei + 3).trim(); s = s.slice(0, ei).trim(); }

  // 並列書名の末尾が巻数なら本題へ戻す（本題が既に数字で終わっている場合は触らない）
  if (altTitle && !/\d\s*$/.test(s)) {
    const m = altTitle.match(/^(.*[^\d\s])[\s.]+(\d{1,3})$/);
    if (m) { altTitle = m[1].trim(); s = s + " " + m[2]; }
  }

  return { title: s, subtitle, altTitle };
}

const toArray = (v) => (v == null ? [] : Array.isArray(v) ? v : [v]);

/** openBD から引く。見つからなければ null を返す */
async function fetchOpenBD(isbn) {
  const data = await fetchJson("https://api.openbd.jp/v1/get?isbn=" + isbn, "openBD");
  const rec = Array.isArray(data) ? data[0] : null;
  if (!rec) return null;

  const summary = rec.summary || {};
  const dd = (rec.onix && rec.onix.DescriptiveDetail) || {};
  const pd = (rec.onix && rec.onix.PublishingDetail) || {};

  // タイトル（ONIX 優先。TitleElement は配列のこともある）
  const te = toArray(dd.TitleDetail && dd.TitleDetail.TitleElement)[0] || {};
  const rawTitle = (te.TitleText && te.TitleText.content) || summary.title || "";
  const onixSub  = (te.Subtitle && te.Subtitle.content) || "";
  const split = splitTitle(rawTitle);

  // 著者（ONIX の Contributor 優先、無ければ summary.author）
  let authors = toArray(dd.Contributor)
    .map((c) => normPersonName(c && c.PersonName && c.PersonName.content))
    .filter(Boolean);
  if (!authors.length && summary.author) {
    authors = String(summary.author).split(/\s+/).map(normPersonName).filter(Boolean);
  }

  const publisher = summary.publisher || (pd.Imprint && pd.Imprint.ImprintName) || "";
  const dateRec = toArray(pd.PublishingDate).find((d) => d && d.Date);
  const pubdate = normPubdate(summary.pubdate || (dateRec && dateRec.Date) || "");

  if (!split.title) return null;   // 中身が無いレコードは「無かった」扱いにする
  return {
    title: split.title,
    altTitle: split.altTitle,
    subtitle: onixSub || split.subtitle,
    authors: authors.join("／"),
    publisher,
    pubdate,
    coverUrl: summary.cover || "",
    source: "openbd",
  };
}

/** Google Books から引く。見つからなければ null を返す */
async function fetchGoogleBooks(isbn) {
  const data = await fetchJson(
    "https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn + "&country=JP",
    "Google Books");
  const items = (data && data.items) || [];
  if (!items.length) return null;

  // ISBN-13 が一致する巻を優先して選ぶ
  const hit = items.find((it) =>
    ((it.volumeInfo && it.volumeInfo.industryIdentifiers) || [])
      .some((id) => (id.identifier || "").replace(/-/g, "") === isbn)) || items[0];

  const vi = hit.volumeInfo || {};
  // 書影は http で返ることがあるので https に寄せ、めくれ効果(edge=curl)を外す
  const rawCover = (vi.imageLinks && (vi.imageLinks.thumbnail || vi.imageLinks.smallThumbnail)) || "";
  const coverUrl = rawCover ? rawCover.replace(/^http:/, "https:").replace(/&edge=curl/, "") : "";

  if (!vi.title) return null;
  return {
    title: vi.title,
    altTitle: "",              // Google Books は並列書名を混ぜてこない
    subtitle: vi.subtitle || "",
    authors: (vi.authors || []).join("／"),
    publisher: vi.publisher || "",
    pubdate: normPubdate(vi.publishedDate || ""),
    coverUrl,
    source: "googlebooks",
  };
}

// ---- 取得キュー（1件ずつ順番に。スキャンは止めない） ----
const queue = [];
let queueBusy = false;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function enqueue(rec) {
  if (rec._status === "loading" || rec._queued) return;
  rec._queued = true;
  rec._status = "wait";
  queue.push(rec);
  render();
  pump();
}

async function pump() {
  if (queueBusy) return;
  queueBusy = true;
  while (queue.length) {
    const rec = queue.shift();
    rec._queued = false;
    await lookupInto(rec);
    await sleep(200);          // API に連打を掛けない
  }
  queueBusy = false;
  render();
}

/** 1件ぶんの書誌取得。成功したら IndexedDB も更新する */
async function lookupInto(rec) {
  rec._status = "loading";
  rec._error = "";
  render();
  refreshToast(rec);

  const errs = [];
  let got = null;

  // 1) openBD
  try {
    got = await fetchOpenBD(rec.isbn13);
  } catch (e) {
    errs.push(e.message || String(e));
  }

  // 2) Google Books（openBD に無かった場合のみ）
  if (!got) {
    try {
      got = await fetchGoogleBooks(rec.isbn13);
    } catch (e) {
      errs.push(e.message || String(e));
      if (e.quota) {
        showError("Google Books の利用上限に達しています",
          "APIキー無しのリクエストは全利用者で1日の上限を共有しており、現在それを使い切っています。\n" +
          "openBD で見つかる本はそのまま登録できます。見つからない本は「未取得を再取得」で後ほど試すか、手入力してください。");
      }
    }
  }

  if (got) {
    Object.assign(rec, got);
    rec._status = "ok";
    await dbPut(rec);
  } else if (errs.length) {
    // 通信に失敗した。ISBN だけの行として既に保存済みなので、データは壊れない
    rec._status = "error";
    rec._error = errs.join(" / ");
    if (!errs.some((m) => /429/.test(m))) {
      showError("書誌の取得に失敗しました（" + rec.isbn13 + "）", rec._error);
    }
  } else {
    // どちらも「見つからなかった」= 通信は成功している
    rec._status = "notfound";
  }
  render();
  refreshToast(rec);
}

/** AudioContext はユーザー操作起点でしか作れないので起動ボタンで用意する */
function initAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {
    // 音が出ないだけなので致命的ではない
    console.warn("AudioContext 初期化に失敗", e);
  }
}

function beep(freq, ms) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const t = audioCtx.currentTime;
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.15, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + ms / 1000 + 0.02);
  } catch (e) {
    console.warn("beep 失敗", e);
  }
}

function vibrate(pattern) {
  // iOS Safari は navigator.vibrate 未対応。対応端末だけ振動する。
  if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (_) {} }
}

let toastTimer = null;
let toastIsbn = null;

function showToast(kind, isbn, main, sub, isbnStyle) {
  toastIsbn = isbn;

}

/** 表示中のトーストが当のレコードのものなら、取得結果で書き換える */
function refreshToast(rec) {
  if (toastIsbn !== rec.isbn13) return;
  const kindNow = toastEl.classList.contains("dup") ? "dup" : "ok";
  if (rec._status === "ok") {
    showToast(kindNow, rec.isbn13, rec.title, metaLine(rec) + "  /  " + srcLabel(rec.source));
  } else if (rec._status === "notfound") {
    showToast("ng", rec.isbn13, rec.isbn13, "書誌が見つかりません。手入力してください", true);
  } else if (rec._status === "error") {
    showToast("ng", rec.isbn13, rec.isbn13, "取得失敗: " + rec._error, true);
  } else {
    showToast(kindNow, rec.isbn13, rec.isbn13, "照会中…", true);
  }
}

function srcLabel(s) {
  return s === "openbd" ? "openBD" : s === "googlebooks" ? "Google Books"
       : s === "manual" ? "手入力" : "";
}
function metaLine(rec) {

// -------------------------------------------------------------
// 読取枠のレイアウト（CSS とデコード対象領域を同じ計算で合わせる）
// -------------------------------------------------------------
function layoutReticle() {
  const w = stage.clientWidth, h = stage.clientHeight;
  const rw = w * BOX.w, rh = h * BOX.h;
  reticle.style.left   = ((w - rw) / 2) + "px";
  reticle.style.top    = ((h - rh) / 2) + "px";
  reticle.style.width  = rw + "px";
  reticle.style.height = rh + "px";
}
window.addEventListener("resize", layoutReticle);
window.addEventListener("orientationchange", () => setTimeout(layoutReticle, 300));

/**
 * 表示上の読取枠（object-fit:cover で描画されている）を
 * video の実ピクセル座標に逆変換して切り出し範囲を返す。
 */
function cropRect() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const dw = stage.clientWidth, dh = stage.clientHeight;
  if (!vw || !vh || !dw || !dh) return null;

  const scale = Math.max(dw / vw, dh / vh);   // cover の拡大率
  const ox = (dw - vw * scale) / 2;           // 表示エリア内での映像左上オフセット
  const oy = (dh - vh * scale) / 2;

  const rw = dw * BOX.w, rh = dh * BOX.h;
  const rx = (dw - rw) / 2, ry = (dh - rh) / 2;

  let sx = (rx - ox) / scale;
  let sy = (ry - oy) / scale;
  let sw = rw / scale;
  let sh = rh / scale;

  // 念のため映像範囲内にクランプ
  sx = Math.max(0, Math.min(vw - 1, sx));
  sy = Math.max(0, Math.min(vh - 1, sy));
  sw = Math.max(1, Math.min(vw - sx, sw));
  sh = Math.max(1, Math.min(vh - sy, sh));
  return { sx, sy, sw, sh };
}

// カメラ
// -------------------------------------------------------------
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError("このブラウザではカメラを使えません",
      "getUserMedia が見つかりません。HTTPS でアクセスしているか確認してください（http:// や file:// では動きません）。");
    return false;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },   // リアカメラ
        width:  { ideal: 1920 },
        height: { ideal: 1080 },
      },
      audio: false,
    });
  } catch (e) {
    const name = (e && e.name) || "UnknownError";
    const msgs = {
      NotAllowedError: "カメラの使用が許可されませんでした。Safari のアドレスバー左の「ぁあ」→「Webサイトの設定」→ カメラ を「許可」にして再読み込みしてください。",
      NotFoundError: "使えるカメラが見つかりませんでした。",
      NotReadableError: "カメラが他のアプリに使われている可能性があります。他のアプリを閉じて再試行してください。",
      OverconstrainedError: "要求した解像度／背面カメラの条件を満たせませんでした。",
      SecurityError: "安全な接続(HTTPS)でないためカメラを使えません。",
    };
    showError("カメラを起動できません（" + name + "）", msgs[name] || (e && e.message) || "");
    return false;
  }

  video.srcObject = stream;
  try {
    await video.play();
  } catch (e) {
    showError("映像の再生に失敗しました", (e && e.message) || "");
    return false;
  }
  // videoWidth が入るまで待つ
  if (!video.videoWidth) {
    await new Promise((res) => {
      video.addEventListener("loadedmetadata", res, { once: true });
      setTimeout(res, 3000);
    });
  }
  layoutReticle();
  return true;
}

function stopCamera() {
  running = false;
  if (stream) {
    // track を確実に止める（これを怠ると iOS でカメラが掴まれたままになる）
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }
  video.srcObject = null;
  releaseWakeLock();
}

// -------------------------------------------------------------
// 画面スリープ抑止（未対応なら黙って無視）
// -------------------------------------------------------------
async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch (_) { /* 未対応 or 拒否。無視してよい */ }
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (_) {} wakeLock = null; }
}

// -------------------------------------------------------------
// デコードループ
// -------------------------------------------------------------
let frames = 0, fps = 0, lastFpsAt = performance.now(), lastRaw = "-";

async function decodeLoop() {
  while (running) {
    // 蔵書・編集を開いている間はデコードしない（気付かないうちに登録されるのを防ぐ）
    if (viewOpen) { await sleep(250); continue; }

    const t0 = performance.now();
    try {
      await decodeOnce();
    } catch (e) {
      // デコード中の例外でループを殺さない
      console.warn("decode error", e);
      lastRaw = "ERR:" + ((e && e.message) || e);
    }
    frames++;
    const now = performance.now();
    if (now - lastFpsAt >= 1000) {
      fps = frames * 1000 / (now - lastFpsAt);
      frames = 0; lastFpsAt = now;
      updateDebug();
    }
    // 1周あたり最低 40ms 空けて UI を止めない
    await new Promise((r) => setTimeout(r, Math.max(0, 40 - (now - t0))));
  }
}

async function decodeOnce() {
  if (video.readyState < 2) return;
  const rect = cropRect();
  if (!rect) return;

  // 横幅 900px 程度に落として速度を稼ぐ（EAN-13 の解像度としては十分）
  const targetW = Math.min(900, Math.round(rect.sw));
  const targetH = Math.max(1, Math.round(rect.sh * (targetW / rect.sw)));
  if (canvas.width !== targetW || canvas.height !== targetH) {
    canvas.width = targetW; canvas.height = targetH;
  }
  ctx2d.drawImage(video, rect.sx, rect.sy, rect.sw, rect.sh, 0, 0, targetW, targetH);
  const imageData = ctx2d.getImageData(0, 0, targetW, targetH);

  const results = await readBarcodes(imageData, READER_OPTIONS);
  if (!results.length) return;

  lastRaw = results.map((r) => r.text).join(" / ");

  for (const r of results) {
    if (r.isValid === false) continue;
    const code = (r.text || "").trim();
    // 978/979 始まりの EAN-13 だけ採用（下段の 192... 分類・価格コードは捨てる）
    if (!isIsbn13(code)) continue;
    handleIsbn(code);
  }
}

async function handleIsbn(isbn) {
  const now = Date.now();
  if (now - (cooldown.get(isbn) || 0) < COOLDOWN_MS) return; // 直近に読んだものは無視
  cooldown.set(isbn, now);

  const known = byIsbn.get(isbn);
  if (known) {
    // 仕様どおり、登録済みは上書きせずスキップ（重複購入チェックとしても機能させる）
    const where = known.location ? "（" + known.location + "）" : "";
    showToast("dup", isbn,
      known.title || isbn,
      "登録済み" + where + " — 上書きしません",
      !known.title);
    beep(330, 120);
    vibrate(30);
    return;
  }

  // まず ISBN だけで保存してしまう。書誌取得が失敗してもデータは残る。
  const rec = newRecord(isbn);
  books.push(rec);
  byIsbn.set(isbn, rec);
  showToast("ok", isbn, isbn, "照会中…", true);
  beep(880, 90);
  vibrate([20, 40, 20]);
  render();
  try {
    await dbPut(rec);
  } catch (_) { /* showError 済み */ }
  enqueue(rec);   // 書誌取得は裏で流す。スキャンは止めない
}

function newRecord(isbn) {
  return {
    isbn13: isbn,
    title: "", altTitle: "", subtitle: "", authors: "", publisher: "", pubdate: "",
    coverUrl: "", location: "", tags: [], note: "", source: "",
    scannedAt: new Date().toISOString(),
    _status: "wait", _error: "",
  };
}

  notfound:"書誌が見つかりません（手入力してください）",

};

/** いま絞り込みが掛かっているか */
const isFiltered = () => qEl.value.trim().length > 0;

/** 検索語で絞り込む */
function filterBooks() {
  const q = qEl.value.trim().toLowerCase();
  if (!q) return books.slice();
  const terms = q.split(/\s+/).filter(Boolean);
  return books.filter((b) => {
    const hay = [b.title, b.altTitle, b.subtitle, b.authors, b.publisher, b.isbn13,
                 b.location, b.note, (b.tags || []).join(" ")]
      .join(" ").toLowerCase();
    return terms.every((t) => hay.includes(t));
  });
}

/** 画面で選ばれている順に並べ替える */
function sortBooks(list) {
  const key = sortSel.value;
  const sorted = list.slice();
  if (key === "scannedAt") {
    sorted.sort((a, b) => String(b.scannedAt).localeCompare(String(a.scannedAt))); // 新しい順
  } else {
    sorted.sort((a, b) => {
      const av = (a[key] || "").toString(), bv = (b[key] || "").toString();
      if (!av && bv) return 1;          // 空欄は末尾へ
      if (av && !bv) return -1;
      return av.localeCompare(bv, "ja");
    });
  }
  return sorted;
}

/** 検索とソートを適用した表示用の配列 */
const visibleBooks = () => sortBooks(filterBooks());

function render() {
  const total = books.length;
  const noTitle = books.filter((b) => !b.title).length;
  const pending = books.filter((b) => b._status === "wait" || b._status === "loading").length;

  cntEl.textContent = total;
  statLine.textContent = "要手入力 " + noTitle + (pending ? " / 照会中 " + pending : "");
  libBtn.textContent = "蔵書 (" + total + ")";

  // 蔵書ビューを閉じている間は一覧の DOM を組み直さない（スキャン中の負荷を避ける）
  if (!libraryEl.classList.contains("open")) return;

  const list = visibleBooks();
  libStat.textContent =
    (qEl.value.trim() ? list.length + " 件表示 / " : "") +
    "全 " + total + " 冊 ・ 要手入力 " + noTitle + (pending ? " ・ 照会中 " + pending : "");

  libList.innerHTML = "";
  if (!list.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = total ? "絞り込み条件に合う本がありません" : "まだ1冊も登録されていません";
    libList.append(li);
    updateBackupBar();
    return;
  }

  list.forEach((rec) => {
    const li = document.createElement("li");
    li.addEventListener("click", (ev) => {
      if (ev.target.closest(".retry")) return;
      openEditor(rec);
    });

    let cov;
    if (rec.coverUrl) {
      cov = document.createElement("img");
      cov.className = "cov";
      cov.loading = "lazy";
      cov.alt = "";
      cov.src = rec.coverUrl;
      cov.addEventListener("error", () => { cov.removeAttribute("src"); });
    } else {
      cov = document.createElement("div");
      cov.className = "cov";
    }

    const body = document.createElement("div");
    body.className = "body";

    const ttl = document.createElement("div");
    ttl.className = "ttl";
    if (rec.title) {
      ttl.textContent = rec.title + (rec.subtitle ? " — " + rec.subtitle : "");
    } else {
      ttl.textContent = STATUS_TEXT[rec._status] || "書名なし（手入力してください）";
      ttl.classList.add(rec._status === "wait" || rec._status === "loading" ? "wait" : "bad");
    }

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = rec.title ? metaLine(rec) : (rec._error || "");

    const code = document.createElement("div");
    code.className = "code";
    code.textContent = isNoIsbn(rec.isbn13) ? "ISBNなし" : rec.isbn13;
    if (rec.source) {
      const chip = document.createElement("span");
      chip.className = "chip " + rec.source;
      chip.textContent = srcLabel(rec.source);
      code.append(chip);
    }
    if (rec.location) {
      const chip = document.createElement("span");
      chip.className = "chip loc";
      chip.textContent = rec.location;
      code.append(chip);
    }

    body.append(ttl, meta, code);
    li.append(cov, body);

    if (!isNoIsbn(rec.isbn13) && (rec._status === "error" || rec._status === "notfound") && !rec.title) {
      const btn = document.createElement("button");
      btn.className = "retry";
      btn.textContent = "再取得";
      btn.addEventListener("click", () => enqueue(rec));
      li.append(btn);
    }

    libList.append(li);
  });

  updateBackupBar();
}

function updateDebug() {
  if (!debugEl.classList.contains("show")) return;
  const vw = video.videoWidth || 0, vh = video.videoHeight || 0;
  debugEl.textContent =
    "cam " + vw + "x" + vh + " / decode " + canvas.width + "x" + canvas.height +
    " / " + fps.toFixed(1) + " fps / queue " + queue.length + "\nlast: " + lastRaw;
}

// =============================================================
// 編集ビュー（新規手入力と既存編集を兼ねる）
// =============================================================
let editing = null;     // 編集中のレコード（新規は null）

function openEditor(rec) {
  editing = rec || null;
  $("edTitle").textContent = rec ? "編集" : "手入力で登録";
  $("edStat").textContent = rec
    ? "登録 " + (rec.scannedAt || "").slice(0, 10) + (rec.source ? " ・ " + srcLabel(rec.source) : "")
    : "バーコードの無い本もここから登録できます";
  $("fIsbn").value      = rec && !isNoIsbn(rec.isbn13) ? rec.isbn13 : "";
  $("fIsbn").readOnly   = !!rec;
  $("fLookup").style.display = rec && isNoIsbn(rec.isbn13) ? "none" : "";
  $("isbnNote").textContent = rec
    ? (isNoIsbn(rec.isbn13) ? "この本は ISBN なしで登録されています（内部キー: " + rec.isbn13 + "）"
                            : "登録済みの ISBN は変更できません。")
    : "バーコードが無い本は空のままで登録できます（内部キーが自動で振られます）。";
  $("fTitle").value     = rec ? rec.title : "";
  $("fSubtitle").value  = rec ? rec.subtitle : "";
  $("fAltTitle").value  = rec ? (rec.altTitle || "") : "";
  $("fAuthors").value   = rec ? rec.authors : "";
  $("fPublisher").value = rec ? rec.publisher : "";
  $("fPubdate").value   = rec ? rec.pubdate : "";
  $("fLocation").value  = rec ? rec.location : "";
  $("fTags").value      = rec ? (rec.tags || []).join("、") : "";
  $("fNote").value      = rec ? rec.note : "";
  $("fCover").value     = rec ? rec.coverUrl : "";
  $("srcNote").textContent = rec && rec._error ? "直近の取得エラー: " + rec._error : "";
  $("edDelete").style.display = rec ? "" : "none";
  openView(editorEl);
}

function parseTags(s) {
  return String(s || "").split(/[,、\s]+/).map((t) => t.trim()).filter(Boolean);
}

async function saveEditor() {
  const isbnRaw = $("fIsbn").value.replace(/[-\s]/g, "").trim();
  let rec = editing;

  if (!rec) {
    // 新規登録
    let key;
    if (isbnRaw) {
      if (!isIsbn13(isbnRaw)) {
        await dialog("ISBN が正しくありません",
          "978 または 979 で始まる13桁で、チェックディジットが合っている必要があります。\n" +
          "入力値: " + isbnRaw + "\n\nISBN が分からない本は、空欄のまま登録できます。",
          [{ label: "戻る", value: null, kind: "primary" }]);
        return;
      }
      if (byIsbn.has(isbnRaw)) {
        const b = byIsbn.get(isbnRaw);
        await dialog("すでに登録されています",
          (b.title || isbnRaw) + "\n\n上書きしないので、編集したい場合は蔵書一覧から開いてください。",
          [{ label: "分かった", value: null, kind: "primary" }]);
        return;
      }
      key = isbnRaw;
    } else {
      key = makeNoIsbnKey();
    }
    rec = newRecord(key);
    rec.source = "manual";
    books.push(rec);
    byIsbn.set(key, rec);
  }

  rec.title     = $("fTitle").value.trim();
  rec.subtitle  = $("fSubtitle").value.trim();
  rec.altTitle  = $("fAltTitle").value.trim();
  rec.authors   = $("fAuthors").value.trim();
  rec.publisher = $("fPublisher").value.trim();
  rec.pubdate   = normPubdate($("fPubdate").value.trim());
  rec.location  = $("fLocation").value.trim();
  rec.tags      = parseTags($("fTags").value);
  rec.note      = $("fNote").value.trim();
  rec.coverUrl  = $("fCover").value.trim();
  if (rec.title) rec._status = "ok";
  if (!rec.source) rec.source = "manual";

  try {
    await dbPut(rec);
  } catch (_) { return; }   // showError 済み。ビューは閉じない
  closeView(editorEl);
  render();
}

async function deleteEditing() {
  if (!editing) return;
  const ok = await dialog("削除しますか",
    (editing.title || editing.isbn13) + "\n\nこの操作は取り消せません。",
    [{ label: "削除する", value: true }, { label: "やめる", value: false, kind: "ghost" }]);
  if (!ok) return;
  try {
    await dbDelete(editing.isbn13);
  } catch (e) {
    showError("削除できませんでした", (e && e.message) || String(e));
    return;
  }
  const i = books.indexOf(editing);
  if (i >= 0) books.splice(i, 1);
  byIsbn.delete(editing.isbn13);
  cooldown.delete(editing.isbn13);
  editing = null;
  closeView(editorEl);
  render();
}

/** 手入力画面から ISBN を打って書誌を引く */
async function lookupFromForm() {
  const isbn = $("fIsbn").value.replace(/[-\s]/g, "").trim();
  if (!isIsbn13(isbn)) {
    await dialog("ISBN が正しくありません",
      "978 または 979 で始まる13桁で、チェックディジットが合っている必要があります。",
      [{ label: "戻る", value: null, kind: "primary" }]);
    return;
  }
  const btn = $("fLookup");
  const before = btn.textContent;
  btn.textContent = "照会中";
  btn.disabled = true;
  try {
    let got = null;
    try { got = await fetchOpenBD(isbn); } catch (e) { /* 下で Google を試す */ }
    if (!got) got = await fetchGoogleBooks(isbn);
    if (!got) {
      await dialog("見つかりませんでした",
        "openBD と Google Books のどちらにもありませんでした。書名以下を手で入れてください。",
        [{ label: "分かった", value: null, kind: "primary" }]);
      return;
    }
    // 入力済みの欄は尊重し、空欄だけ埋める
    const fill = (id, v) => { if (v && !$(id).value.trim()) $(id).value = v; };
    fill("fTitle", got.title);
    fill("fAltTitle", got.altTitle);
    fill("fSubtitle", got.subtitle);
    fill("fAuthors", got.authors);
    fill("fPublisher", got.publisher);
    fill("fPubdate", got.pubdate);
    fill("fCover", got.coverUrl);
    if (editing) editing.source = got.source;
  } catch (e) {
    showError("照会に失敗しました", (e && e.message) || String(e));
  } finally {
    btn.textContent = before;
    btn.disabled = false;
  }
}

// =============================================================
// Word (.docx) 出力
//   docx 9.7.1 を ESM で遅延読み込みする（約1MB なので起動時には取りに行かない）
//   UMD ビルド(index.umd.cjs)は jsDelivr が application/node + nosniff で返すため
//   <script> では読めない。ESM の dist/index.mjs を使う。
// =============================================================
const DOCX_URL = "https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.mjs";
let docxLib = null;

async function loadDocx() {
  if (!docxLib) docxLib = await import(DOCX_URL);
  return docxLib;
}

// 本文フォント。Windows の Word と macOS/iOS のどちらにもあるものを既定にする
const DOC_FONT = "Yu Gothic";

/** 表の列。幅は mm（A4 縦・左右15mm 余白で本文幅 180mm） */
const COLUMNS = [
  { head: "No.",    w: 10, get: (r, i) => String(i + 1), align: "right" },
  { head: "書名",    w: 52, get: (r) => r.title || "（書名未入力）", sub: (r) => r.subtitle },
  { head: "著者",    w: 32, get: (r) => r.authors },
  { head: "出版社",  w: 26, get: (r) => r.publisher },
  { head: "出版年",  w: 16, get: (r) => r.pubdate },
  { head: "ISBN",   w: 26, get: (r) => (isNoIsbn(r.isbn13) ? "—" : r.isbn13) },
  { head: "配置場所", w: 18, get: (r) => r.location },
];

function buildDocument(D, list, scopeLabel) {
  const mm = D.convertMillimetersToTwip;
  const widths = COLUMNS.map((c) => mm(c.w));
  const CELL_MARGIN = { top: 40, bottom: 40, left: 70, right: 70 };

  const runOpts = (extra) => Object.assign({ font: DOC_FONT, size: 18 }, extra); // 18 half-pt = 9pt

  const cell = (children, opts) => new D.TableCell({
    width: { size: opts.w, type: D.WidthType.DXA },
    shading: opts.head ? { fill: "E7EBF0" } : undefined,
    verticalAlign: D.VerticalAlign.CENTER,
    margins: CELL_MARGIN,
    children,
  });

  const textCell = (text, opts) => cell(
    [new D.Paragraph({
      alignment: opts.align === "right" ? D.AlignmentType.RIGHT : D.AlignmentType.LEFT,
      children: [new D.TextRun(runOpts({ text: text || "", bold: !!opts.head }))],
    })], opts);

  // ヘッダ行（tableHeader: true でページをまたいでも繰り返される）
  const headerRow = new D.TableRow({
    tableHeader: true,
    children: COLUMNS.map((c, i) =>
      textCell(c.head, { w: widths[i], head: true, align: c.align })),
  });

  const bodyRows = list.map((rec, idx) => new D.TableRow({
    children: COLUMNS.map((c, i) => {
      const main = c.get(rec, idx);
      const sub = c.sub ? c.sub(rec) : "";
      if (!sub) return textCell(main, { w: widths[i], align: c.align });
      // 書名の下にサブタイトルを小さく添える
      return cell([
        new D.Paragraph({ children: [new D.TextRun(runOpts({ text: main }))] }),
        new D.Paragraph({ children: [new D.TextRun(runOpts({ text: sub, size: 16, color: "555555" }))] }),
      ], { w: widths[i] });
    }),
  }));

  const table = new D.Table({
    width: { size: 100, type: D.WidthType.PERCENTAGE },
    layout: D.TableLayoutType.FIXED,
    columnWidths: widths,
    rows: [headerRow, ...bodyRows],
  });

  const now = new Date();
  const stamp = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日 " +
                String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");

  return new D.Document({
    styles: { default: { document: { run: { font: DOC_FONT, size: 18 } } } },
    sections: [{
      properties: {
        page: {
          size: { width: mm(210), height: mm(297) },      // A4 縦
          margin: { top: mm(18), bottom: mm(18), left: mm(15), right: mm(15) },
        },
      },
      footers: {
        default: new D.Footer({
          children: [new D.Paragraph({
            alignment: D.AlignmentType.CENTER,
            children: [new D.TextRun(runOpts({ children: ["— ", D.PageNumber.CURRENT, " —"], size: 16, color: "777777" }))],
          })],
        }),
      },
      children: [
        new D.Paragraph({
          alignment: D.AlignmentType.CENTER,
          spacing: { after: 120 },
          children: [new D.TextRun(runOpts({ text: "蔵書目録", bold: true, size: 36 }))],  // 18pt
        }),
        new D.Paragraph({
          alignment: D.AlignmentType.CENTER,
          spacing: { after: 240 },
          children: [new D.TextRun(runOpts({
            text: "出力日時 " + stamp + "　／　総冊数 " + list.length + " 冊" +
                  (scopeLabel ? "（" + scopeLabel + "）" : ""),
            size: 16, color: "555555",
          }))],
        }),
        table,
      ],
    }],
  });
}

async function exportDocx() {
  if (!books.length) {
    await dialog("出力できません", "まだ1冊も登録されていません。",
      [{ label: "閉じる", value: null, kind: "primary" }]);
    return;
  }

  // 仕様どおり、絞り込み結果だけか全件かを出力前に選ばせる
  let list, scopeLabel = "";
  if (isFiltered()) {
    const filtered = visibleBooks();
    const choice = await dialog("どちらを出力しますか",
      "絞り込み: 「" + qEl.value.trim() + "」",
      [
        { label: "絞り込み結果だけ（" + filtered.length + " 冊）", value: "filtered", kind: "primary" },
        { label: "全件（" + books.length + " 冊）", value: "all" },
        { label: "やめる", value: null, kind: "ghost" },
      ]);
    if (!choice) return;
    if (choice === "filtered") {
      list = filtered;
      scopeLabel = "絞り込み: " + qEl.value.trim();
    } else {
      list = sortBooks(books.slice());
    }
  } else {
    const ok = await dialog("Word 目録を出力します",
      "全 " + books.length + " 冊を " + sortSel.options[sortSel.selectedIndex].text + " 順で出力します。",
      [{ label: "出力する", value: true, kind: "primary" }, { label: "やめる", value: false, kind: "ghost" }]);
    if (!ok) return;
    list = visibleBooks();
  }

  const btn = $("docxBtn");
  const before = btn.textContent;
  btn.textContent = "生成中…";
  btn.disabled = true;
  try {
    const D = await loadDocx();
    const doc = buildDocument(D, list, scopeLabel);
    const blob = await D.Packer.toBlob(doc);
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    saveBlob(blob, "蔵書目録-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
                   "-" + p(d.getHours()) + p(d.getMinutes()) + ".docx");
  } catch (e) {
    showError("Word の生成に失敗しました", (e && (e.stack || e.message)) || String(e));
  } finally {
    btn.textContent = before;
    btn.disabled = false;
  }
}

/** Blob をダウンロードとして保存させる（共有シート対応はフェーズ5） */
function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// =============================================================
// JSON エクスポート / インポート
//   iOS Safari では IndexedDB が ITP で消える可能性があるため必須の機能
// =============================================================
const LS_BACKUP = "bookshelf.lastBackup";

function exportJson() {
  const payload = {
    app: "bookshelf-scanner",
    format: 1,
    exportedAt: new Date().toISOString(),
    count: books.length,
    books: books.map(toPlain),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  saveBlob(blob, "bookshelf-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
                 "-" + p(d.getHours()) + p(d.getMinutes()) + ".json");

  try {
    localStorage.setItem(LS_BACKUP, JSON.stringify({ at: new Date().toISOString(), count: books.length }));
  } catch (_) {}
  updateBackupBar();
}

async function importJson(file) {
  let payload;
  try {
    payload = JSON.parse(await file.text());
  } catch (e) {
    showError("読み込めませんでした", "JSON として解釈できません: " + ((e && e.message) || e));
    return;
  }
  const incoming = Array.isArray(payload) ? payload : (payload && payload.books);
  if (!Array.isArray(incoming)) {
    showError("読み込めませんでした", "books 配列が見つかりません。このアプリが書き出した JSON を選んでください。");
    return;
  }
  const valid = incoming.filter((b) => b && typeof b.isbn13 === "string" && b.isbn13);
  if (!valid.length) {
    showError("読み込めませんでした", "有効なレコードが1件もありませんでした。");
    return;
  }
  const dup = valid.filter((b) => byIsbn.has(b.isbn13)).length;

  const mode = await dialog("読み込み方法",
    valid.length + " 件を読み込みます。\n" +
    "うち " + dup + " 件が現在の蔵書と重複しています。\n" +
    (valid.length !== incoming.length
      ? "（" + (incoming.length - valid.length) + " 件は ISBN が無く読み飛ばします）\n" : ""),
    [
      { label: "重複はそのまま・新規だけ追加", value: "skip", kind: "primary" },
      { label: "重複はファイルの内容で上書き", value: "overwrite" },
      { label: "現在の蔵書を全部消して置き換え", value: "replace" },
      { label: "やめる", value: null, kind: "ghost" },
    ]);
  if (!mode) return;

  if (mode === "replace") {
    const ok = await dialog("本当に置き換えますか",
      "現在の " + books.length + " 冊をすべて削除してから " + valid.length + " 件を入れます。\nこの操作は取り消せません。",
      [{ label: "置き換える", value: true }, { label: "やめる", value: false, kind: "ghost" }]);
    if (!ok) return;
    try {
      await reqToPromise(store("readwrite").clear());
    } catch (e) {
      showError("消去に失敗しました", (e && e.message) || String(e));
      return;
    }
    books.length = 0; byIsbn.clear(); cooldown.clear();
  }

  let added = 0, updated = 0, skipped = 0;
  for (const raw of valid) {
    const exists = byIsbn.get(raw.isbn13);
    if (exists && mode === "skip") { skipped++; continue; }
    const rec = Object.assign(exists || newRecord(raw.isbn13), toPlain(raw));
    rec._status = rec.title ? "ok" : "notfound";
    rec._error = "";
    if (!exists) { books.push(rec); byIsbn.set(rec.isbn13, rec); added++; }
    else updated++;
    try { await dbPut(rec); } catch (_) { return; }
  }
  render();
  await dialog("読み込みました",
    "追加 " + added + " 件 / 上書き " + updated + " 件 / スキップ " + skipped + " 件",
    [{ label: "閉じる", value: null, kind: "primary" }]);
}

function updateBackupBar() {
  const msg = $("backupMsg");
  let last = null;
  try { last = JSON.parse(localStorage.getItem(LS_BACKUP) || "null"); } catch (_) {}
  if (!books.length) {
    msg.textContent = "";
    msg.className = "msg";
    return;
  }
  if (!last) {
    msg.textContent = "まだ一度もバックアップしていません。iOS では使わない期間が続くと保存データが消えることがあります。";
    msg.className = "msg warn";
    return;
  }
  const diff = books.length - (last.count || 0);
  const days = Math.floor((Date.now() - new Date(last.at).getTime()) / 86400000);
  msg.textContent = "最終バックアップ: " + last.at.slice(0, 10) + "（" + last.count + " 冊時点）" +
                    (diff > 0 ? " ・ その後 " + diff + " 冊増えています" : "");
  msg.className = "msg" + (diff >= 10 || days >= 14 ? " warn" : "");
}

// =============================================================
// ビューの開閉
// =============================================================
function openView(el) {
  viewOpen = true;            // デコードを止める
  el.classList.add("open");
}
function closeView(el) {
  el.classList.remove("open");
  viewOpen = libraryEl.classList.contains("open") || editorEl.classList.contains("open");
}

// -------------------------------------------------------------
// 起動・停止
// -------------------------------------------------------------
async function start() {
  clearError();
  startBtn.disabled = true;
  startBtn.textContent = "準備中…";
  initAudio();

  // wasm を先に取りに行く（初回のみ 約1MB）
  try {
    prepareZXingModule({
      overrides: {
        locateFile: (path, prefix) =>
          path.endsWith(".wasm") ? WASM_BASE + path : prefix + path,
      },
      fireImmediately: true,
    });
  } catch (e) {
    showError("読取エンジン(wasm)の読み込み設定に失敗しました", (e && e.message) || "");
  }

  const ok = await startCamera();
  if (!ok) {
    startBtn.disabled = false;
    startBtn.textContent = "再試行";
    return;
  }

  startPanel.style.display = "none";
  toggleBtn.disabled = false;
  toggleBtn.textContent = "停止";
  toggleBtn.classList.remove("primary");
  running = true;
  requestWakeLock();
  decodeLoop();
}

function pause() {
  running = false;
  stopCamera();
  startPanel.style.display = "";
  startBtn.disabled = false;
  startBtn.innerHTML = "カメラを<br>再開";
  toggleBtn.textContent = "再開";
  toggleBtn.classList.add("primary");
}

// ---- イベント ----
startBtn.addEventListener("click", start);
toggleBtn.addEventListener("click", () => { if (running) pause(); else start(); });

libBtn.addEventListener("click", () => { openView(libraryEl); render(); });
$("libCloseBtn").addEventListener("click", () => closeView(libraryEl));
manualBtn.addEventListener("click", () => openEditor(null));

$("edCancel").addEventListener("click", () => closeView(editorEl));
$("edSave").addEventListener("click", saveEditor);
$("edDelete").addEventListener("click", deleteEditing);
$("fLookup").addEventListener("click", lookupFromForm);

qEl.addEventListener("input", render);
sortSel.addEventListener("change", render);

$("docxBtn").addEventListener("click", exportDocx);
$("exportBtn").addEventListener("click", exportJson);
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", (ev) => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";     // 同じファイルを続けて選べるように
  if (f) importJson(f);
});
$("retryAllBtn").addEventListener("click", () => {
  const targets = books.filter((b) => !b.title && !isNoIsbn(b.isbn13));
  if (!targets.length) return;
  clearError();
  targets.forEach(enqueue);
});

$("dbgBtn").addEventListener("click", () => {
  debugEl.classList.toggle("show");
  updateDebug();
});

// タブが非アクティブ／画面を離れたらカメラを確実に解放する
document.addEventListener("visibilitychange", () => {
  if (document.hidden && running) pause();
});
window.addEventListener("pagehide", stopCamera);

// 想定外の例外も画面に出す
window.addEventListener("error", (ev) => {
  showError("スクリプトエラー",
    (ev.message || "") + "\n" + (ev.filename || "") + ":" + (ev.lineno || ""));
});
window.addEventListener("unhandledrejection", (ev) => {
  const r = ev.reason;
  showError("未処理のエラー", (r && (r.stack || r.message)) || String(r));
});

// =============================================================
// 初回起動時の案内（iOS の ITP 対策）
// =============================================================
const LS_INTRO = "bookshelf.seenIntro";
function isStandalone() {
  return window.navigator.standalone === true ||
         (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
}
async function maybeShowIntro() {
  let seen = null;
  try { seen = localStorage.getItem(LS_INTRO); } catch (_) { return; }
  if (seen || isStandalone()) return;
  await dialog("ホーム画面に追加して使ってください",
    "iOS の Safari は、しばらく使わないでいるとサイトの保存データ（この蔵書データ）を消すことがあります。\n\n" +
    "共有ボタン → 「ホーム画面に追加」 をしてから、そのアイコンで開くと消されなくなります。\n\n" +
    "併せて、蔵書画面の「バックアップ (JSON)」でときどき書き出しておいてください。",
    [{ label: "分かった", value: null, kind: "primary" }]);
  try { localStorage.setItem(LS_INTRO, "1"); } catch (_) {}
}

// =============================================================
// 起動処理
// =============================================================
(async function init() {
  layoutReticle();
  try {
    db = await openDB();
  } catch (e) {
    showError("保存領域(IndexedDB)を開けません",
      ((e && e.message) || String(e)) +
      "\nプライベートブラウズ中だと使えません。通常のタブで開いてください。");
    render();
    return;
  }
  let migrated = 0;
  try {
    const rows = await dbGetAll();
    for (const row of rows) {
      const rec = Object.assign(newRecord(row.isbn13), row);
      rec._status = row.title ? "ok" : "notfound";
      // 並列書名を別項目に分けるようにする前のデータを移行する
      if (!rec.altTitle && rec.title && rec.title.includes(" = ")) {
        const sp = splitTitle(rec.title);
        rec.title = sp.title;
        rec.altTitle = sp.altTitle;
        if (sp.subtitle && !rec.subtitle) rec.subtitle = sp.subtitle;
        migrated++;
      }
      books.push(rec);
      byIsbn.set(rec.isbn13, rec);
    }
  } catch (e) {
    showError("保存済みデータを読み出せませんでした", (e && e.message) || String(e));
  }
  render();

  if (migrated) {
    for (const rec of books) {
      if (rec.altTitle) { try { await dbPut(rec); } catch (_) { break; } }
    }
    await dialog("書名を整理しました",
      migrated + " 件の書名から、後ろに付いていた並列書名（欧文タイトルなど）を別項目に移しました。\n" +
      "巻数が並列書名の末尾に付いていた本は、巻数だけ書名側に戻してあります。\n" +
      "おかしくなっている本があれば、蔵書一覧から直してください。",
      [{ label: "分かった", value: null, kind: "primary" }]);
  }
  maybeShowIntro();
})();
</script>
